<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario - Modo Oscuro</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #121212;
      color: #f0f0f0;
    }

    header, nav, footer {
      background-color: #1e1e1e;
      text-align: center;
      padding: 15px;
      border-bottom: 1px solid #333;
    }

    nav a {
      color: #a0cfff;
      text-decoration: none;
      margin: 0 10px;
    }

    main {
      max-width: 600px;
      margin: 30px auto;
      background-color: #1e1e1e;
      padding: 20px;
      border: 1px solid #333;
      border-radius: 5px;
    }

    h2 {
      text-align: center;
    }

    form label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    form input, form textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      background-color: #2b2b2b;
      color: #f0f0f0;
      border: 1px solid #444;
      border-radius: 3px;
    }

    form button {
      margin-top: 20px;
      padding: 10px 15px;
      background-color: #007BFF;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 3px;
    }

    form button:hover {
      background-color: #0056b3;
    }

    footer {
      border-top: 1px solid #333;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mi Sitio Web</h1>
  </header>

  <nav>
    <a href="#">Inicio</a> | 
    <a href="#">Acerca de</a> | 
    <a href="#">Contacto</a>
  </nav>

  <main>
    <h2>Formulario de Contacto</h2>
    <form>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre">

      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email">

      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="5"></textarea>

      <button type="submit">Enviar</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Mi Sitio Web</p>
  </footer>

</body>
</html>
